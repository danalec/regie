[package]
name = "regie-core"
description = "no_std deterministic regex engine: safe dialect, Thompson NFA, Pike VM, compact DFA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/regie-core"
readme = "README.md"
keywords = ["regex", "no-std", "dfa", "nfa", "embedded"]
categories = ["text-processing", "parser-implementations", "embedded", "no-std"]

[features]
default = []
# Enables heap-backed helpers (DFA construction, owned pattern buffers).
alloc = []
# Enables `std` integration (std::error::Error, formatting helpers).
std = ["alloc"]
# Enables UTF-8 aware character classes.
unicode = []
# Enables serde derives for serializable artifacts.
serde = ["dep:serde", "alloc"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }
# The reference engine the benchmarks compare against.
regex-automata = { workspace = true }

[[bench]]
name = "engine"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
