[package]
name = "regie-codec"
description = "Serialization of compiled regie automata for embedded firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/regie-codec"
readme = "README.md"
keywords = ["serialization", "dfa", "firmware", "no-std", "codec"]
categories = ["encoding", "embedded", "no-std"]

[features]
default = []
alloc = ["regie-core/alloc"]
std = ["alloc", "regie-core/std"]

[dependencies]
regie-core = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# The examples build an automaton, which needs the allocator of `regie-core`.
regie-core = { workspace = true, features = ["alloc"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
