[package]
name = "regie-search"
description = "Verified hypothesis search over structured regex specifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/regie-search"
readme = "README.md"
keywords = ["regex", "search", "hypothesis", "verification", "no-std"]
categories = ["text-processing", "algorithms", "development-tools"]

[features]
default = []
alloc = ["regie-core/alloc"]
std = ["alloc", "regie-core/std"]
mcts = []

[dependencies]
regie-core = { workspace = true }
regie-intent = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
