[package]
name = "regie-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
regie-core = { path = "../crates/regie-core" }

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compiler"
path = "fuzz_targets/compiler.rs"
test = false
doc = false
bench = false

[workspace]
