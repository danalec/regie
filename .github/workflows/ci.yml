name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Host build: the full test suite, the lints and the documentation.
  # ---------------------------------------------------------------------------
  host:
    name: host (${{ matrix.os }}, rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@${{ matrix.toolchain }}
        with:
          components: rustfmt, clippy

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build without default features (the no_std path)
        run: cargo build --workspace --no-default-features

      - name: Build with every feature
        run: cargo build --workspace --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps

  # ---------------------------------------------------------------------------
  # Cross compilation to the bare-metal targets the project targets.
  # ---------------------------------------------------------------------------
  embedded:
    name: embedded (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-none
          - thumbv7em-none-eabihf
          - riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: embedded-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build regie-core for the bare-metal target
        run: |
          cargo build -p regie-core --no-default-features --target ${{ matrix.target }}
          cargo build -p regie-core --no-default-features --features alloc --target ${{ matrix.target }}
          cargo build -p regie-core --no-default-features --features serde --target ${{ matrix.target }}

      - name: Build regie-codec for the bare-metal target
        run: cargo build -p regie-codec --no-default-features --target ${{ matrix.target }}

      - name: Build regie-intent for the bare-metal target
        run: cargo build -p regie-intent --no-default-features --target ${{ matrix.target }}

      - name: Check the size of the core
        run: |
          # The `no_std` core must stay small enough to link into firmware.
          cargo install cargo-size --locked
          cargo size --release -p regie-core --no-default-features --target ${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # The allocator-free guarantee is checked with a custom target that has no
  # allocator at all: the `thumbv6m` target only links `core`.
  # ---------------------------------------------------------------------------
  no-allocator:
    name: no-allocator (thumbv6m-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - name: Build the core without an allocator
        run: cargo build -p regie-core --no-default-features --target thumbv6m-none-eabi

  # ---------------------------------------------------------------------------
  # The fuzz targets are compiled, and the corpus is replayed for a short time
  # so a regression cannot sit unnoticed until the next nightly run.
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz (short run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build the fuzz targets
        run: cargo fuzz build --manifest-path fuzz/Cargo.toml

      - name: Run the fuzzer briefly
        run: |
          cargo fuzz run parser --manifest-path fuzz/Cargo.toml -- -max_total_time=60
          cargo fuzz run compiler --manifest-path fuzz/Cargo.toml -- -max_total_time=60

  # ---------------------------------------------------------------------------
  # The differential test against Python's `re` proves that the dialect is
  # faithful where it overlaps with the reference implementation.
  # ---------------------------------------------------------------------------
  differential:
    name: differential vs Python re
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the differential example
        run: cargo build -p regie-core --example differential

      - name: Compare against Python
        run: python tools/differential_test.py --cases 20000

  # ---------------------------------------------------------------------------
  # Every output that the documentation quotes is run and compared, so that a
  # gallery cannot drift away from the code it describes.
  # ---------------------------------------------------------------------------
  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the documented outputs
        run: python tools/check_examples.py

  # ---------------------------------------------------------------------------
  # Coverage of the core engine.
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Measure the coverage of regie-core
        run: |
          cargo llvm-cov --package regie-core --all-features --summary-only \
            --fail-under-lines 90

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/llvm-cov/target/site
